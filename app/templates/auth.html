{% extends "base.html" %}{% block body %}
<h2>{{ 'Create account' if mode=='register' else 'Log in' }}</h2>
<form method="post" class="col-md-5"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
{% if mode=='register' %}<label class="form-label" for="name">Name</label><input id="name" name="name" class="form-control mb-2" required>{% endif %}
<label class="form-label" for="email">Email</label><input id="email" name="email" type="email" class="form-control mb-2" required>
<label class="form-label" for="password">Password</label><input id="password" name="password" type="password" class="form-control mb-3" required>
<button class="btn btn-primary">{{ 'Create account' if mode=='register' else 'Log in' }}</button></form>
<p class="mt-3">{% if mode=='login' %}New here? <a href="/register">Create an account</a>{% else %}Have an account? <a href="/login">Log in</a>{% endif %}</p>
{% endblock %}
